services:
  api:
    image: node:20
    working_dir: /app
    command: >-
      bash -lc "corepack enable &&
      pnpm install &&
      pnpm --filter @finlens/api db:migrate &&
      pnpm --filter @finlens/api db:seed &&
      pnpm --filter @finlens/api dev"
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - ./data:/app/data
      - pnpm-store:/root/.local/share/pnpm/store

  web:
    image: node:20
    working_dir: /app
    command: >-
      bash -lc "corepack enable &&
      pnpm install &&
      pnpm --filter @finlens/web dev --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - ./data:/app/data
      - pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      - api

volumes:
  pnpm-store:
