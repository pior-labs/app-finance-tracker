services:
  api:
    build:
      context: ./api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: ${API_PORT:-3000}
      UPLOAD_DIR: /app/data/uploads
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-in-production}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    networks:
      - default
      - finlens_private

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"

networks:
  finlens_private:
    external: true
