services:
  api:
    build:
      context: ./api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: ${API_PORT:-3000}
      DATABASE_URL: /app/data/finlens.db
      UPLOAD_DIR: /app/data/uploads
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - api
    ports:
      - "8080:80"
